<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Vitrina de premios por nivel: primeros premios, podios, finalista y menciones.">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Premios · Certificates Archive</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premios.css">
</head>
<body class="pag-premios">
  <header class="bar glass">
    <div class="brand">
      <img src="img/logo.svg" alt="" width="36" height="36">
      <div>
        <h1>Certificates <b>Archive</b></h1>
        <p id="count" class="sub">Cargando…</p>
      </div>
    </div>
    <nav class="chips" aria-label="Secciones">
      <a class="chip" href="pared.html">Pared</a>
      <a class="chip" href="mapa.html">Mapa</a>
      <a class="chip" href="premios.html" aria-current="page">Premios</a>
    </nav>
  </header>

  <main id="premios">
    <aside class="resumen" aria-label="Resumen de premios">
      <div id="peg"></div>
      <p id="total" class="total num">0</p>
      <p class="sub">premios y reconocimientos</p>
      <dl id="niveles" class="niveles"></dl>
      <section class="anios" aria-label="Premios por año">
        <p class="kicker anios-t">Por año</p>
        <div id="anios"></div>
      </section>
    </aside>

    <section id="vitrina" class="vitrina" aria-label="Vitrina de premios"></section>

    <div id="ficha" class="ficha glass" role="group" aria-labelledby="fTitulo" hidden>
      <button id="fCerrar" class="btn ghost redondo" aria-label="Cerrar">
        <svg class="icono" aria-hidden="true"><use href="img/iconos.svg#cerrar"/></svg>
      </button>
      <p id="fFecha" class="kicker"></p>
      <h2 id="fTitulo"></h2>
      <p id="fOrg" class="sub"></p>
      <div class="f-nivel">
        <span id="fMetal" class="metal-punto"></span>
        <span><b id="fNivel"></b><span id="fPremio" class="sub"></span></span>
      </div>
      <button id="fVer" class="btn" type="button">Ver el certificado</button>
    </div>
    <div id="notice" class="notice" hidden></div>
  </main>

  <div id="visor" class="sheet" role="dialog" aria-modal="true" aria-label="Certificado" hidden>
    <div class="sheet-card glass visor-card" tabindex="-1">
      <button id="vCerrar" class="btn ghost redondo close" aria-label="Cerrar el certificado">
        <svg class="icono" aria-hidden="true"><use href="img/iconos.svg#cerrar"/></svg>
      </button>
      <figure class="sello visor-sello"><img id="vImg" alt=""></figure>
    </div>
  </div>

  <script src="iconos.js"></script>
  <script src="pasaporte.js"></script>
  <script src="premios.js"></script>
</body>
</html>
